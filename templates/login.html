<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة قمم التعليمية</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #2E7D32;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }
        .login-card {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 5px;
        }
        .login-card h2 {
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: normal;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-left: 45px;
        }
        .toggle-password {
            position: absolute;
            left: 12px;
            cursor: pointer;
            color: #7f8c8d;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.3s;
        }
        .toggle-password:hover {
            color: var(--primary);
        }
        .error-msg {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
        }
        .login-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: var(--primary-dark);
        }
        .hint {
            font-size: 0.85rem;
            color: #999;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <img src="/data/ZID1_transparent2.png" alt="Robot" style="position: absolute; left: 12%; top: 35%; transform: translateY(-30%); width: 380px; max-width: 35vw; object-fit: contain; z-index: 0; opacity: 1; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));">


    <div class="login-card">
        <div style="font-size: 3rem; margin-bottom: 10px;">🎓</div>
        <h1 style="font-size: 1.8rem; color: var(--primary-dark); font-weight: 900; margin: 0 0 5px 0;">Plateforme Éducative<br>LES CRETES</h1>
        <div style="margin-bottom: 30px;"></div>
        <form id="login-form">
            <div class="input-group">
                <label for="student-name">الاسم الكامل للتلميذ</label>
                <input type="text" id="student-name" placeholder="أدخل اسمك هنا" required>
            </div>
            <div class="input-group">
                <label for="password">كلمة السر</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة السر" required>
                    <span class="toggle-password" id="toggle-password">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </span>
                </div>
            </div>
            
            <div class="error-msg" id="error-msg">كلمة السر خاطئة. الرجاء المحاولة مرة أخرى.</div>
            
            <button type="submit" class="login-btn">دخول</button>
        </form>
    </div>

    <script>
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
            }
        });

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('student-name').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if(pass === '0000') {
                localStorage.setItem('student_name', name);
                window.location.href = '/dashboard';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
